# E2E 固定数据模式：只跑 fixture 采集器（fixtures/*.json），确定性断言
home: /home/jerry
devforge: /home/jerry/tools/dev-forge
fixturesDir: FIXTURES_DIR_PLACEHOLDER
# E2E 自带声明（CI 机器上没有 /home/jerry/tools/dev-forge 绝对路径，不能依赖真实 registry.d）
registryDir: REGISTRY_DIR_PLACEHOLDER
# 入库隔离到测试产物目录（gitignored），不污染真实本地源 console/state/first-party
firstPartyStoreDir: STORE_DIR_PLACEHOLDER
workspaces:
  - id: jerry
    name: Jerry's Forge
    projects:
      - git: https://github.com/tadki/KingOfLikes-Godot.git
        path: /e2e/king-of-likes
        harnesses: [claude]
      - git: https://github.com/tadki/godot-mcp.git
        path: /e2e/king-of-likes/addons/godot_mcp
        harnesses: [claude]
    residents: [Fronti, Revy]
multica:
  enabled: false
hindsight:
  probe: false
  configPath: /e2e/none.json
  apiBase: http://127.0.0.1:1
reports:
  toolchainLatest: /e2e/none-latest.json
  archPatrol: /e2e/none-arch.json
