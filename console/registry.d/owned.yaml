# 自建资产注册表 —— 声明即归属：匹配到的资产盖 provenance=first-party + meta（优先于采集器推断）
# 通用 meta 词汇表：owner / category / lifecycle(stable|experimental|deprecated) /
#                   criticality(high|medium|low) / runtime(claude-code|multica|both|standalone) / docs / since / notes
# platforms：声明该资产已应用到的平台（claude-code|multica）。不写 = 不参与平台对账（平台 → 本地 / 本地 → 平台）
# match 粒度：idPrefix/pathPrefix 前缀；ids 精确清单；exclude 前缀命中后排除（平台自带剔除）。
# 顺序敏感：第一条命中生效（first-match-wins），更具体的条目必须写在宽泛条目（如 devforge-core）之前。
# 归属口径（Owner 2026-11-06）：multica 平台上扫到的全部资产都是自建；本地 ~/.claude/skills 与 multica 同名的是重复错放，清理掉。
entries:
  - id: forge-console
    match: { idPrefix: "service:systemd-forge-console" }
    meta: { owner: jerry, category: infra, lifecycle: experimental, criticality: low, runtime: standalone, since: "2026-11-03" }

  - id: devforge-hooks-engine
    match: { pathPrefix: "/home/jerry/tools/dev-forge/claude-hooks" }
    platforms: [claude-code]
    meta: { owner: atlas, category: governance, lifecycle: stable, criticality: high, runtime: claude-code, notes: "9 挂载点 → 统一引擎（settings.json hooks）" }

  - id: devforge-hook-registrations
    match: { idPrefix: "hook-registration:" }
    platforms: [claude-code]
    meta: { owner: atlas, category: governance, lifecycle: stable, criticality: high, runtime: claude-code }

  - id: kol-instructions
    match: { pathPrefix: "/mnt/d/GodotProjects/king-of-likes/CLAUDE.md" }
    platforms: [claude-code]
    meta: { owner: jerry, category: game, lifecycle: stable, criticality: medium, runtime: both }

  - id: multica-platform-agents
    match: { pathPrefix: "multica://agents/" }
    platforms: [multica]
    meta: { owner: jerry, category: platform, lifecycle: stable, criticality: high, runtime: multica }

  - id: multica-platform-autopilots
    match: { pathPrefix: "multica://autopilots/" }
    platforms: [multica]
    meta: { owner: jerry, category: platform, lifecycle: stable, criticality: medium, runtime: multica }

  - id: multica-platform-skills
    match: { pathPrefix: "multica://skills/" }
    platforms: [multica]
    meta: { owner: jerry, category: platform, lifecycle: stable, criticality: medium, runtime: multica }

  - id: devforge-autopilots
    # 含 review-prompts 子树（Owner 2026-11-11 目录归集：评审 prompt 只服务 autopilot，归入 autopilots/）
    match: { pathPrefix: "/home/jerry/tools/dev-forge/autopilots/" }
    platforms: [multica]
    meta: { owner: jerry, category: governance, lifecycle: stable, criticality: medium, runtime: multica }

  - id: devforge-adapters
    # adapter 是跨平台胶水脚本（协议翻译/启动包装/事件转发/跨机操作），不适配任何平台：
    # 不声明 platforms（不参与平台对账），资产落平台页未适配桶，注册表照常收录（Owner 2026-11-11）
    match: { pathPrefix: "/home/jerry/tools/dev-forge/adapters/" }
    meta: { owner: jerry, category: infra, lifecycle: stable, criticality: medium, runtime: standalone }

  - id: devforge-patches
    # 本地补丁程序（对第三方运行时/配置的修改以补丁为单位管理；Owner 2026-11-11 从 ~/.hindsight/patches 收编进仓库 patches/）
    match: { pathPrefix: "/home/jerry/tools/dev-forge/patches/" }
    platforms: [claude-code]
    meta: { owner: jerry, category: memory, lifecycle: stable, criticality: medium, runtime: claude-code, notes: "hindsight 插件本地补丁；应用基线 state 由 devforge-patches 采集器实测漂移" }

  # 宽泛兜底：dev-forge 仓库下其余资产（必须排在所有 dev-forge 子路径条目之后）
  - id: devforge-core
    match: { pathPrefix: "/home/jerry/tools/dev-forge/" }
    meta: { owner: jerry, category: infra, lifecycle: stable, criticality: high, runtime: standalone }

  - id: mcp-user-search
    match: { pathPrefix: "/home/jerry/.claude/.mcp.json" }
    platforms: [claude-code]
    meta: { owner: jerry, category: infra, lifecycle: stable, criticality: medium, runtime: claude-code }

  - id: godot-mcp-endpoint
    match: { pathPrefix: "/mnt/d/GodotProjects/king-of-likes/.mcp.json" }
    platforms: [claude-code]
    meta: { owner: jerry, category: game, lifecycle: stable, criticality: medium, runtime: claude-code }

  - id: godot-mcp-instructions
    match: { pathPrefix: "/mnt/d/GodotProjects/king-of-likes/addons/godot_mcp/CLAUDE.md" }
    platforms: [claude-code]
    meta: { owner: jerry, category: game, lifecycle: stable, criticality: medium, runtime: claude-code }

  - id: godot-qa-toolkit-instructions
    match: { pathPrefix: "/home/jerry/tools/godot-qa-toolkit/CLAUDE.md" }
    platforms: [claude-code]
    meta: { owner: jerry, category: infra, lifecycle: stable, criticality: medium, runtime: claude-code }

  - id: grepai-instructions
    match: { pathPrefix: "/home/jerry/tools/grepai/CLAUDE.md" }
    platforms: [claude-code]
    meta: { owner: jerry, category: infra, lifecycle: stable, criticality: medium, runtime: claude-code }

  - id: hindsight-integration
    match: { pathPrefix: "/home/jerry/.hindsight/" }
    platforms: [claude-code]
    meta: { owner: jerry, category: memory, lifecycle: stable, criticality: medium, runtime: claude-code }
