# 自建资产注册表 —— 声明即归属：匹配到的资产盖 provenance=first-party + meta（优先于采集器推断）
# 通用 meta 词汇表：owner / category / lifecycle(stable|experimental|deprecated) /
#                   criticality(high|medium|low) / runtime(claude-code|multica|both|standalone) / docs / since / notes
# platforms：声明该资产已应用到的平台（claude-code|multica）。不写 = 不参与平台对账（平台 → 本地 / 本地 → 平台）
entries:
  - id: forge-console
    match: { idPrefix: "service:systemd-forge-console" }
    meta: { owner: jerry, category: infra, lifecycle: experimental, criticality: low, runtime: standalone, since: "2026-11-03" }

  - id: devforge-hooks-engine
    match: { pathPrefix: "/home/jerry/tools/dev-forge/claude-hooks" }
    platforms: [claude-code, multica]
    meta: { owner: atlas, category: governance, lifecycle: stable, criticality: high, runtime: both, notes: "9 挂载点 → 统一引擎，multica 会话同样生效" }

  - id: devforge-core
    match: { pathPrefix: "/home/jerry/tools/dev-forge/" }
    meta: { owner: jerry, category: infra, lifecycle: stable, criticality: high, runtime: standalone }

  - id: kol-instructions
    match: { pathPrefix: "/mnt/d/GodotProjects/king-of-likes/CLAUDE.md" }
    platforms: [claude-code]
    meta: { owner: jerry, category: game, lifecycle: stable, criticality: medium, runtime: both }

  - id: multica-platform-agents
    match: { pathPrefix: "multica://agents/" }
    platforms: [multica]
    meta: { owner: jerry, category: platform, lifecycle: stable, criticality: high, runtime: multica }

  - id: multica-platform-autopilots
    match: { pathPrefix: "multica://autopilots/" }
