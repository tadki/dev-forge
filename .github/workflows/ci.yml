name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax check (bash -n)
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "bash -n FAIL: $f"; fail=1; }
          done < <(find claude-hooks bootstrap launch adapters autopilots tests -name "*.sh" 2>/dev/null)
          exit $fail
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning $(find bootstrap launch adapters -name "*.sh")
      # gqt complexity gate（SEE-1463 §SPEC-009）：CI 守护复杂度治理回归。
      # 安装行 pin git tag v0.1.0——tag 落地前由 Leader 合并 GQT PR 后补打；
      # tag 不存在时本步在本地验证（pip 装远程 @tag 属既定时序，Phase 7 复核）。
      - name: gqt complexity gate
        run: |
          pip install -q "git+https://github.com/tadki/godot-qa-toolkit.git@v0.1.0"
          gqt complexity . --warn 10 --max 15
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install test requirements
        run: pip install -q -r tests/requirements.txt
      - name: P0 engine suite
        run: bash tests/test_v2_unified_engine_p0.sh
      - name: validator
        run: node --test tests/validator.test.mjs
      - name: pytest full suite
        run: python3 -m pytest tests/ -q
      - name: run_all shell suites
        run: bash tests/run_all.sh
